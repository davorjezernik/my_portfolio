<section class="flex-justyfy-align white-font">
    <div class="main-container column">
        <div class="container-one">
            <div class="container-text">
                <div class="text-container display-flex column">
                    <div class="h1-decoration">
                        <div>
                            <p class="font-size-20 weight-500">{{ 'TRANSLATE.SKILL_STACK' | translate }}</p>
                            <div class="bg-wrapper">
                                <div class="bg-animation"></div>
                                <h1 class="font-size-64 weight-700">{{ 'TRANSLATE.SKILL_AOT' | translate }}</h1>
                            </div>
                        </div>
                    </div>
                </div>     
            </div>
        </div>
        <div class="container-two display-flex">
        <div class="display-flex">
            <div class="flex-justyfy-align">
                <div class="container-skill display-flex">
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets\skill_set_img\front_end\html.svg">
                        <p class="font-size-18 weight-400">HTML</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/css.svg">
                        <p class="font-size-18 weight-400">CSS</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/javascript.svg">
                        <p class="font-size-18 weight-400">JavaScript</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/typescript.svg">
                        <p class="font-size-18 weight-400">TypeScript</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets\skill_set_img\front_end\angular.svg">
                        <p class="font-size-18 weight-400">Angular</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/firebase.svg">
                        <p class="font-size-18 weight-400">Firebase</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/git.svg">
                        <p class="font-size-18 weight-400">Git</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/rest_api.svg">
                        <p class="font-size-18 weight-400">Rest-Api</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/scrum.svg">
                        <p class="font-size-18 weight-400">Scrum</p>
                    </div>
                    <div class="img-txt flex-justyfy-align column">
                        <img src="assets/skill_set_img/front_end/materialdesign.svg">
                        <p class="display-flex font-size-18 weight-400">Material Design</p>   
                    </div>         
                </div>
            </div>          
            </div> 
                <div class="peel-off-container">  
                    <img class="img3" src="assets/skill_set_img/done.webp"/>
                    <div class="img3-text flex-justyfy-align">
                        <div class="layer-zero flex-justyfy-align column">
                            <p class="font-size-18 weight-700">{{ 'TRANSLATE.SKILL_OPEN' | translate }}</p>
                            <div class="display-flex">
                                <div class="flex-justyfy-align column img-text-learn">
                                    <img src="assets/skill_set_img/react.webp">
                                    <p class="font-size-16 weight-400">React</p>
                                </div>  
                                <div class="flex-justyfy-align column img-text-learn">
                                    <img src="assets/skill_set_img/VueJs.webp">
                                    <p class="font-size-16 weight-400">Vue Js</p>
                                </div>
                            </div>
                        </div>       
                    </div>
                    <img class="img2" src="assets/skill_set_img/mid.webp" [ngClass]="{ show: showImg2 && !hideImg2, hide: hideImg2 }"/>
                    <div (click)="startPeelOff()">
                        <img class="img1" src="assets/skill_set_img/default.webp" [class.hide]="hideImg1"/>
                        <div class="img1-text flex-justyfy-align pointer" [class.hide]="hideImg1Text">
                            <div class="layer-one flex-justyfy-align pointer">
                                <img class="arrow-img" src="assets/skill_set_img/white_arrow.webp" />
                                <p class="font-size-24 weight-400">{{ 'TRANSLATE.SKILL_PULL' | translate }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</section>
